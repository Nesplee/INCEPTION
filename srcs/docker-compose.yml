version: '3'

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    volumes:
      - wordpress:/var/www/html/wordpress
    env_file:
      - .env
    depends_on:
      - mariadb
    restart: unless-stopped
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html/wordpress
    depends_on:
      - wordpress
    restart: unless-stopped
    networks:
      - inception

  website:
    build: ./requirements/bonus/website
    container_name: website
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - inception

  adminer:
    build: ./requirements/bonus/adminer
    container_name: adminer
    ports:
      - "8081:8081"
    depends_on:
      - mariadb
    restart: unless-stopped
    networks:
      - inception

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - inception

  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress:/var/www/html/wordpress
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - inception

  n8n:
    build: ./requirements/bonus/n8n
    container_name: n8n
    restart: always
    env_file: .env
    environment:
      - N8N_HOST=n8n.dinguyen.42.fr
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.dinguyen.42.fr/
      - N8N_EDITOR_BASE_URL=https://n8n.dinguyen.42.fr/
      - N8N_SECURE_COOKIE=true
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=Europe/Zurich
    volumes:
      - n8n:/home/node/.n8n
    networks:
      - inception

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dimitri/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dimitri/data/wordpress
  n8n:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dimitri/data/n8n

networks:
  inception:
    driver: bridge



